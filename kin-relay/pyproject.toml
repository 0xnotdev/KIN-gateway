[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kin-relay"
version = "1.1.0"
description = "Directory and Relay Service for KIN Personal Agent Network"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "fastapi==0.133.1",
    "uvicorn==0.41.0",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "pytest==8.4.2",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["kin_relay*"]
