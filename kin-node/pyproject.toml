[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kin-cli"
version = "0.1.0"
description = "KIN — Personal Agent Network"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "cryptography",
    "mnemonic",
    "keyring",
    "typer",
    "rich",
    "prompt_toolkit",
    "litellm",
    "openai",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
kin = "kin.cli:app"

[tool.setuptools.packages.find]
include = ["kin*"]
