[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kin-cli"
version = "1.1.0"
description = "KIN — Personal Agent Network"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "fastapi==0.133.1",
    "uvicorn==0.41.0",
    "httpx==0.28.1",
    "cryptography==50.0.0",
    "mnemonic==0.21",
    "keyring==25.7.0",
    "typer==0.27.0",
    "rich==14.3.3",
    "textual==8.2.8",
    "prompt_toolkit==3.0.52",
    "litellm==1.89.1",
    "openai==2.24.0",
    "pydantic==2.13.4",
    "rfc8785==0.1.4",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "pytest-textual-snapshot==1.1.0",
]

[project.scripts]
kin = "kin.cli:app"
kin-tui = "kin.tui.__main__:main"

[tool.setuptools.packages.find]
include = ["kin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: Two-process local socket smoke test",
]
addopts = "-m 'not smoke'"
