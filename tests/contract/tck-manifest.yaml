      "disposition": "expected-unsupported",
      "expected_count": 1,
      "contains_any": ["test_empty_version_treated_as_default_jsonrpc"],
      "reason": "KIN pins A2A 1.0 and explicitly rejects implicit 0.3 downgrade; the TCK assertion only checks for any JSON result/error."
    },
    {
      "id": "TCK-JSONRPC-ENDPOINT-PATH",
      "disposition": "tracked-defect",
      "expected_count": 65,
      "contains_any": ["[jsonrpc]", "-jsonrpc]", "/jsonrpc/", "::TestJsonRpcFormat", "::TestJsonRpcStreaming", "::TestJsonRpcErrorStructure"],
      "reason": "The pinned TCK JsonRpcClient posts to '/' and discards the non-root interface URL path; KIN and the released SDK correctly advertise/use /a2a/jsonrpc."
    },
    {
      "id": "TCK-GENERATED-SUT-NOT-PINNED",
      "disposition": "tracked-defect",
      "expected_count": 17,
      "contains_any": ["test_artifacts.py", "test_multi_stream.py", "test_task_history.py", "test_task_lifecycle.py"],
      "reason": "These remaining HTTP+JSON cases require TCK-specific scenario behavior; the generated SUT has an unresolved sibling SDK source and imports no released compatible SDK."
    },
    {
      "id": "SDK-UNKNOWN-FIELD-STRICTNESS",
      "disposition": "tracked-defect",
      "expected_count": 6,
      "contains_any": ["test_data_model.py"],
      "reason": "Four cases inherit the TCK JSON-RPC path defect; the released SDK strictly rejects the two SHOULD-level unknown-field probes."
    },
    {
      "id": "TCK-NO-REQUIREMENT-AT-LEVEL",
      "disposition": "expected-unsupported",
      "expected_count": 1,
      "contains_any": ["test_requirements.py"],
      "reason": "The pinned TCK emits a placeholder skip because no HTTP+JSON requirement exists at that selected level."
    },
    {
      "id": "SDK-CONTENT-TYPE-STRICTNESS",
      "disposition": "tracked-defect",
      "expected_count": 1,
      "contains_any": ["test_content_type_not_supported_returns_415"],
