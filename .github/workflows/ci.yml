name: V1.1 release gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node + TUI (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: kin-node/pyproject.toml
      - name: Install node test environment
        run: python -m pip install -e "./kin-node[dev]"
      - name: Compile all shipped modules
        run: python -m compileall -q kin-node/kin kin-node/scripts
      - name: Unit, storage, contract, integration, TUI, accessibility, security
        working-directory: kin-node
        env:
          KIN_UNSAFE_TEST_KEYRING: '1'
        run: python -m pytest -q

  relay:
    name: Relay (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: kin-relay/pyproject.toml
      - run: python -m pip install -e "./kin-relay[dev]"
      - working-directory: kin-relay
        run: python -m pytest -q

  real-process-smoke:
    name: Real relay/node process smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: kin-node/pyproject.toml
      - run: python -m pip install -e "./kin-node[dev]" -e ./kin-relay
      - working-directory: kin-node
        env:
          KIN_UNSAFE_TEST_KEYRING: '1'
        run: python -m pytest -q -m smoke

  packaging:
    name: Build and clean-wheel install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build==1.5.0
      - run: python -m build --outdir release-ci ./kin-node
      - run: python -m build --outdir release-ci ./kin-relay
      - name: Install node wheel into clean environment
        shell: pwsh
        run: |
          python -m venv .wheel-test
          $python = if ($IsWindows) { '.wheel-test\Scripts\python.exe' } else { '.wheel-test/bin/python' }
          $kin = if ($IsWindows) { '.wheel-test\Scripts\kin.exe' } else { '.wheel-test/bin/kin' }
          $wheel = (Get-ChildItem release-ci/kin_cli-1.1.0-*.whl | Select-Object -First 1).FullName
          if ($IsWindows) {
            & $python -m pip install --constraint release/requirements-windows.lock $wheel
          } else {
            & $python -m pip install $wheel
          }
          & $kin --version
      - name: Audit exact Windows release lock
        if: runner.os == 'Windows'
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r release/requirements-windows.lock
